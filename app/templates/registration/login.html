{% extends "app/base.html" %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post" style="display:grid;gap:12px">
{% csrf_token %}

<label for="id_username">Login</label>
<input type="text" name="username" id="id_username" autocomplete="username" required>

<label for="id_password">Senha</label>
<input type="password" name="password" id="id_password" autocomplete="current-password" required>

{% if form.errors %}
<p class="alerta" role="alert">Login ou senha inválidos. Confira os dados e tente novamente.</p>
{% endif %}

<button class="botao" type="submit">Entrar</button>
</form>
{% endblock %}
