<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Associação Mãos Amigas</title>
<style>
:root{--fundo:#f4f2ec;--cartao:#fff;--texto:#1d2b24;--primaria:#1f6b4a;--sobre:#fff;--borda:#6f7f76}
body.contraste{--fundo:#000;--cartao:#000;--texto:#fff;--primaria:#ffff00;--sobre:#000;--borda:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,sans-serif;font-size:16px;line-height:1.5}
.topo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--primaria);color:var(--sobre);font-weight:bold}
button{min-height:44px;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
.topo button{border:2px solid var(--sobre);background:transparent;color:var(--sobre)}
main{max-width:560px;margin:auto;padding:16px;display:grid;gap:12px}
.botao{display:block;min-height:56px;width:100%;border:2px solid var(--primaria);background:var(--primaria);color:var(--sobre);border-radius:12px;font:inherit;font-weight:bold;padding:12px;text-decoration:none;cursor:pointer}
.secundario{background:var(--cartao);color:var(--primaria)}
input{width:100%;min-height:48px;border:2px solid var(--borda);border-radius:8px;padding:10px;font:inherit;background:var(--cartao);color:var(--texto)}
label{font-weight:bold}
.item,.msg{border:2px solid var(--borda);border-radius:12px;padding:12px;background:var(--cartao)}
.selo{display:inline-block;font-weight:bold;border:2px solid currentColor;border-radius:8px;padding:4px 8px}
.ok{color:#14502f;background:#e3f1e8}
.pend,.alerta{color:#6b3f00;background:#fff1d6;border:3px solid #b36b00;padding:10px;border-radius:8px}
.grande{font-size:2.4rem;font-weight:bold}
a:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid orange;outline-offset:2px}
</style>
</head>
<body>
<header class="topo">
<span>🧺 Mãos Amigas</span>
<div>
<button type="button" id="menos">A−</button>
<button type="button" id="mais">A+</button>
<button type="button" id="contraste" aria-pressed="false">Alto contraste</button>
{% if user.is_authenticated %}
<form method="post" action="{% url 'logout' %}" style="display:inline">
{% csrf_token %}
<button type="submit">Sair</button>
</form>
{% endif %}
</div>
</header>
<main>
{% if user.is_authenticated and request.path != '/' %}
<a class="botao secundario" href="{% url 'menu' %}">← Voltar ao início</a>
{% endif %}
{% for m in messages %}
<p class="msg" role="status">{{ m }}</p>
{% endfor %}
{% block conteudo %}{% endblock %}
</main>
<script>
(function(){
const html=document.documentElement;
const body=document.body;
let tamanho=Number(localStorage.getItem('tamanho')||16);
let alto=localStorage.getItem('alto')==='1';
function aplicar(){
html.style.fontSize=tamanho+'px';
body.classList.toggle('contraste',alto);
document.getElementById('contraste').setAttribute('aria-pressed',alto);
}
document.getElementById('menos').onclick=function(){tamanho=Math.max(14,tamanho-2);localStorage.setItem('tamanho',tamanho);aplicar();};
document.getElementById('mais').onclick=function(){tamanho=Math.min(28,tamanho+2);localStorage.setItem('tamanho',tamanho);aplicar();};
document.getElementById('contraste').onclick=function(){alto=!alto;localStorage.setItem('alto',alto?'1':'0');aplicar();};
aplicar();
})();
</script>
</body>
</html>
