name: CI

on:
  push:
    branches: ["test/testes-automatizados", "main"]
  pull_request:
    branches: ["main"]

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install "Django>=5.2,<5.3" coverage

      - name: Rodar os testes com cobertura
        run: coverage run --source=app --omit="app/tests.py,app/migrations/*" manage.py test

      - name: Mostrar o relatório de cobertura
        run: coverage report -m
